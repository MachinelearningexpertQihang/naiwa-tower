#boot{position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;transition:opacity 1s ease}
#boot.out{opacity:0;pointer-events:none}
#boot .bk{width:40vmin;height:40vmin;opacity:0;animation:bootMk 1.1s .35s ease-out forwards}
#boot .bk img{width:100%;height:100%;display:block}
#boot .bn{color:#fff;font:11.5vmin 'NWBoot',serif;letter-spacing:.25em;padding-left:.25em;opacity:0;animation:bootNm .9s 1s ease-out forwards}
#boot .bn i{font-style:normal;color:#e5191c}
#boot.out .bk{transform:scale(1.02)}
@keyframes bootMk{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes bootNm{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#boot .lg{display:flex;flex-direction:column;align-items:center;gap:4vmin;transition:opacity .9s cubic-bezier(.4,0,.2,1)}
#boot.p2 .lg{opacity:0}
#boot .adv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vmin;color:#fff;pointer-events:none;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
#boot .adv{opacity:0;transition:opacity 1s cubic-bezier(.4,0,.2,1)}
#boot.p2 .adv{opacity:1;transition-delay:1s}
#boot .adv h2{margin:0 0 1.5vmin;font-size:5.6vmin;font-weight:700;letter-spacing:.5em;padding-left:.5em}
#boot .adv p{margin:0;font-size:3.9vmin;letter-spacing:.18em;padding-left:.18em;line-height:1.5}
